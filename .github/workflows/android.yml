name: Build RewindYou APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android.yml"
      - "*.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ARCHIVE=$(find . -maxdepth 1 -type f -name 'RewindYou-source-v0.2.0.zip' -print -quit)
          if [ -z "$ARCHIVE" ]; then
            echo "No se encontró el ZIP del proyecto."
            exit 1
          fi
          mkdir source
          unzip -q "$ARCHIVE" -d source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Align Java and Kotlin targets
        working-directory: source/RewindYou/app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build.gradle.kts")
          s = p.read_text()
          s = s.replace("android {", """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """, 1)
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: source/RewindYou
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RewindYou-APK
          path: source/RewindYou/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
