
name: Build RewindYou APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android.yml"
      - "*.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ARCHIVE=$(find . -maxdepth 1 -type f -name 'RewindYou-source-v0.2.1-selector-fix.zip' -print -quit)
          if [ -z "$ARCHIVE" ]; then
            echo "No se encontró el ZIP del proyecto."
            exit 1
          fi
          mkdir source
          unzip -q "$ARCHIVE" -d source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Falta el secreto de la clave de firma."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > source/RewindYou/app/rewindyou-release.jks


      - name: Configure release signing
        working-directory: source/RewindYou/app
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("build.gradle.kts")
          s = p.read_text()

          if 'create("release")' in s:
              raise SystemExit("La configuración release ya existe; no se modificó el archivo.")

          marker = "android {\n"
          if marker not in s:
              raise SystemExit("No se encontró el bloque android.")

          signing = """android {
              signingConfigs {
                  create("release") {
                      storeFile = file("rewindyou-release.jks")
                      storePassword = System.getenv("RELEASE_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("RELEASE_KEY_ALIAS")
                      keyPassword = System.getenv("RELEASE_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          """

          s = s.replace(marker, signing, 1)
          p.write_text(s)
          PY


      - name: Build signed release APK
        working-directory: source/RewindYou
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: RewindYou-signed-APK
          path: source/RewindYou/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
