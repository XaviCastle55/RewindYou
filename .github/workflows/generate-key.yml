name: Generar llave de firma (una sola vez)

# Crea una llave nueva DENTRO de GitHub, sin que pase por ningún chat.
# Ejecútalo con el repositorio en PRIVADO. El resultado queda en un artefacto
# que dura 1 día: descárgalo, copia los 4 valores a los secretos y bórralo.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate signing key
        run: |
          PASS=$(openssl rand -hex 16)
          echo "::add-mask::$PASS"
          keytool -genkeypair -keystore rewindyou-release.jks -storetype PKCS12 \
            -alias rewindyou -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=RewindYou, O=XaviCastle55"
          B64=$(base64 -w 0 rewindyou-release.jks)
          {
            echo "REWINDYOU - DATOS DE LA LLAVE DE FIRMA (NUEVA)"
            echo "Guarda este archivo en un lugar seguro y NO lo subas ni lo compartas."
            echo "Si lo pierdes, tendras que crear otra llave y todos deberan reinstalar la app."
            echo
            echo "=================================================="
            echo "SECRETO 1 - Nombre:"
            echo "RELEASE_KEYSTORE_BASE64"
            echo "Valor (una sola linea larga, copiala completa):"
            echo "$B64"
            echo
            echo "=================================================="
            echo "SECRETO 2 - Nombre:"
            echo "RELEASE_KEYSTORE_PASSWORD"
            echo "Valor:"
            echo "$PASS"
            echo
            echo "=================================================="
            echo "SECRETO 3 - Nombre:"
            echo "RELEASE_KEY_ALIAS"
            echo "Valor:"
            echo "rewindyou"
            echo
            echo "=================================================="
            echo "SECRETO 4 - Nombre:"
            echo "RELEASE_KEY_PASSWORD"
            echo "Valor:"
            echo "$PASS"
          } > signing-secrets.txt
          # La huella es publica: sirve para comprobar despues que la app se firma con esta llave.
          keytool -list -keystore rewindyou-release.jks -storepass "$PASS" -alias rewindyou | grep "SHA-256"
          rm rewindyou-release.jks

      - name: Upload the secrets file (private, 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: llave-de-firma
          path: signing-secrets.txt
          retention-days: 1
          if-no-files-found: error
